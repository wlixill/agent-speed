name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zstd
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - name: Check fixtures with the reference implementation
        run: python3 spec/tools/reference.py --check-fixtures
      - name: Check reporting and profile contracts
        run: |
          python3 spec/tools/report_reference.py
          python3 spec/tools/execution_modes_reference.py
          python3 spec/tools/test_reporting_extensions.py
      - name: Validate vehicle art
        run: python3 spec/tools/vehicles.py
      - name: Lint installer
        run: shellcheck install.sh

  linux:
    name: Ubuntu AI agent monitor
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install UI and native traffic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xserver-xephyr x11-utils desktop-file-utils fonts-noto-cjk clang-14 gcc make pkg-config linux-libc-dev libelf-dev zlib1g-dev policykit-1 libicu70 libssl3 libfontconfig1 libfreetype6 libx11-6 libxext6 libxi6 libxrandr2 libxcursor1 libxfixes3 libice6 libsm6 libgl1 libgtk-3-0
      - name: Test shared core on Linux
        run: dotnet test windows/tests/AgentSpeed.Core.Tests -c Release
      - name: Test Linux application logic
        run: dotnet test linux/tests/AgentSpeed.Linux.Tests -c Release
      - name: Publish Ubuntu preview
        run: bash linux/scripts/publish.sh
      - name: Package and validate Ubuntu Debian installer
        run: |
          bash linux/scripts/package-deb.sh --publish-dir dist/AgentSpeed-Ubuntu-linux-x64
          python3 linux/scripts/check-deb.py dist/agent-speed_$(cat VERSION)-$(cat linux/DEBIAN_REVISION)_amd64.deb
      - name: Exercise X11 app with synthetic Codex logs
        run: xvfb-run -a python3 linux/scripts/smoke_test.py dist/AgentSpeed-Ubuntu-linux-x64/AgentSpeed.Linux
      - name: Validate vehicle animation and rich history rendering
        run: xvfb-run -a python3 linux/scripts/visual-smoke.py dist/AgentSpeed-Ubuntu-linux-x64/AgentSpeed.Linux
      - name: Validate settings, model counters and background startup
        run: xvfb-run -a python3 linux/scripts/feature-smoke.py dist/AgentSpeed-Ubuntu-linux-x64/AgentSpeed.Linux
      - name: Validate production pricing, themes, execution modes and numeric tray
        run: xvfb-run -a python3 linux/scripts/app-feature58-smoke.py
      - name: Validate production sources, independent orbs and optional feature windows
        run: xvfb-run -a python3 linux/scripts/app-feature912-smoke.py
      - name: Validate advanced history interactions and CSV
        run: xvfb-run -a python3 linux/scripts/history-advanced-smoke.py
      - name: Validate advanced independent orb controls and geometry
        run: xvfb-run -a python3 linux/scripts/advanced-orbs-smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Ubuntu-linux-x64
          path: |
            dist/AgentSpeed-Ubuntu-linux-x64.tar.gz
            dist/agent-speed_*_amd64.deb
            dist/agent-speed_*_amd64.deb.sha256
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Test core
        working-directory: macos
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E '✘ Test [^ ]+ (recorded|failed)|error:' "$RUNNER_TEMP/test.log" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Build app bundle
        run: macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-macOS
          path: dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test core
        shell: bash
        run: |
          set -o pipefail
          dotnet test windows/tests/AgentSpeed.Core.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/core.log" || {
            names="$(grep -oE '^\s*Failed [A-Za-z0-9_.]+' "$RUNNER_TEMP/core.log" | sed -E 's/^\s*Failed //; s/^AgentSpeed\.[A-Za-z]+\.Tests\.//' | sort -u | paste -sd',' -)"
            echo "::error::Failed tests: ${names:0:3500}"
            grep -E -A2 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/core.log" | grep -E 'Error Message' -A1 | grep -vE 'Error Message|^--' | sed -E 's/[0-9a-f]{32}//g' | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          }
      - name: Test presentation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          dotnet test windows/tests/AgentSpeed.Presentation.Tests -c Release 2>&1 | tee "$RUNNER_TEMP/presentation.log" || {
            names="$(grep -oE '^\s*Failed [A-Za-z0-9_.]+' "$RUNNER_TEMP/presentation.log" | sed -E 's/^\s*Failed //; s/^AgentSpeed\.[A-Za-z]+\.Tests\.//' | sort -u | paste -sd',' -)"
            echo "::error::Failed tests: ${names:0:3500}"
            grep -E -A2 '^\s*Failed [A-Za-z]' "$RUNNER_TEMP/presentation.log" | grep -E 'Error Message' -A1 | grep -vE 'Error Message|^--' | sed -E 's/[0-9a-f]{32}//g' | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          }
      - name: Test traffic helper
        run: dotnet test windows/tests/AgentSpeed.TrafficHelper.Tests -c Release
      - name: Publish
        shell: pwsh
        run: ./windows/scripts/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows
          path: dist/AgentSpeed-Windows-*.zip
          if-no-files-found: error
